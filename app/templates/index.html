<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Clarity Enhancer</title>
<link rel="stylesheet" href="/static/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<div class="container">
  <header>
    <h1>PDF 清晰化工具</h1>
    <p class="subtitle">将扫描版 PDF 转换为清晰可搜索的文字型 PDF</p>
  </header>

  <!-- Upload Zone -->
  <div id="uploadZone" class="upload-zone">
    <div class="upload-content">
      <div class="upload-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <p class="upload-text">拖放 PDF 文件到此处，或 <span class="browse-link">点击浏览</span></p>
      <p class="upload-hint">支持中英文混合扫描 PDF，最大 100MB</p>
      <input type="file" id="fileInput" accept=".pdf" hidden>
    </div>
  </div>

  <!-- Progress Section -->
  <div id="progressSection" class="progress-section hidden">
    <div class="progress-header">
      <span id="stageLabel" class="stage-label">准备中...</span>
      <span id="pageLabel" class="page-label"></span>
    </div>
    <div class="progress-bar-track">
      <div id="progressBar" class="progress-bar-fill"></div>
    </div>
    <p id="progressMessage" class="progress-message"></p>
    <button id="cancelBtn" class="btn btn-cancel">取消</button>
  </div>

  <!-- Result Section -->
  <div id="resultSection" class="result-section hidden">
    <div class="result-actions">
      <a id="downloadBtn" class="btn btn-primary" href="#" download>下载增强后的 PDF</a>
      <button id="newFileBtn" class="btn btn-secondary">处理新文件</button>
    </div>
    <div class="preview-container">
      <div class="preview-pane">
        <h3>原始 PDF</h3>
        <div id="originalPreview" class="preview-box"></div>
      </div>
      <div class="preview-pane">
        <h3>增强后 PDF</h3>
        <div id="enhancedPreview" class="preview-box"></div>
      </div>
    </div>
  </div>

  <!-- Error Section -->
  <div id="errorSection" class="error-section hidden">
    <div class="error-box">
      <h3>处理失败</h3>
      <p id="errorMessage"></p>
      <button id="retryBtn" class="btn btn-primary">重新上传</button>
    </div>
  </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
